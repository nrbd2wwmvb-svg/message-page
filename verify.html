<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Order</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#fff;
  min-height:100vh
}

.top{
  height:205px;
  background:linear-gradient(135deg,#159cff,#1688ee)
}

.card{
  margin-top:-25px;
  background:#fff;
  border-radius:42px 42px 0 0;
  min-height:calc(100vh - 180px);
  padding:80px 28px
}

.wrap{
  max-width:520px;
  margin:auto;
  text-align:center
}

h1{
  font-size:32px;
  margin-bottom:15px
}

.description{
  color:#777;
  line-height:1.5;
  margin-bottom:55px
}

.reference{
  background:#f5f5f5;
  border-radius:18px;
  padding:22px;
  margin-bottom:35px
}

.reference small{
  display:block;
  color:#888;
  margin-bottom:8px
}

.reference strong{
  font-size:24px;
  letter-spacing:2px
}

input{
  width:100%;
  height:78px;
  border:2px solid #aaa;
  border-radius:20px;
  text-align:center;
  font-size:25px;
  letter-spacing:5px;
  outline:none
}

input:focus{
  border-color:#168ff7
}

button{
  width:100%;
  height:70px;
  margin-top:30px;
  border:none;
  border-radius:22px;
  background:#168ff7;
  color:white;
  font-size:21px;
  font-weight:800
}

#result{
  margin-top:20px;
  font-size:15px
}

</style>
</head>

<body>

<div class="top"></div>

<div class="card">

<div class="wrap">

<h1>Verify Order</h1>

<div class="description">
Enter the internal verification code provided for this payment request.
Do not enter bank, SMS, PIN or third-party security codes here.
</div>

<div class="reference">
  <small>Payment Reference</small>
  <strong id="reference">---</strong>
</div>

<input
  id="code"
  maxlength="6"
  inputmode="numeric"
  placeholder="000000"
>

<button id="verify">
Verify
</button>

<div id="result"></div>

</div>

</div>

<script>

const BACKEND_URL = "PUT_YOUR_WORKER_URL_HERE";

const params = new URLSearchParams(location.search);
const reference = params.get("ref");

document.getElementById("reference").textContent =
  reference || "UNKNOWN";

document.getElementById("verify").onclick = async () => {

  const code =
    document.getElementById("code").value.trim();

  const result =
    document.getElementById("result");

  if(!reference || !code){
    result.textContent = "Enter the verification code.";
    return;
  }

  try{

    const response = await fetch(
      BACKEND_URL + "/verify",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          reference,
          code
        })
      }
    );

    const data = await response.json();

    if(data.ok){
      result.textContent =
        "✓ Payment request verified.";
    }else{
      result.textContent =
        "Invalid verification code.";
    }

  }catch(e){

    result.textContent =
      "Verification service unavailable.";

  }

};

</script>

</body>
</html>
