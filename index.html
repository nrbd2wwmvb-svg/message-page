<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#1598f5">

  <title>Payment Wallet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Arial, sans-serif;

      background: #1595f3;
      color: #0b0b0b;
    }

    /* BLUE HEADER */
    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      height: 220px;

      background:
        linear-gradient(
          145deg,
          #26a8ff 0%,
          #168ff4 55%,
          #1186ed 100%
        );

      z-index: 0;
    }

    /* MAIN WHITE PAGE */
    .page {
      position: relative;
      z-index: 1;

      margin-top: 185px;

      min-height: calc(100vh - 185px);

      background: #ffffff;

      border-radius: 46px 46px 0 0;

      padding:
        72px
        28px
        calc(35px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    /* LOGO */
    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: 950;
      letter-spacing: -3px;
      line-height: 0.9;
    }

    .logo span {
      display: block;

      margin-top: 14px;

      font-size: 31px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 48px;
      margin-bottom: 58px;

      text-align: center;

      font-size: 21px;
      font-weight: 650;
    }

    /* FORM */
    .field {
      position: relative;
      margin-bottom: 31px;
    }

    .field label {
      position: absolute;
      z-index: 2;

      left: 29px;
      top: -13px;

      padding: 0 11px;

      background: #ffffff;

      color: #9a9a9a;

      font-size: 18px;
      font-weight: 650;

      transition: 0.2s;
    }

    .field:focus-within label {
      color: #168ff7;
    }

    input {
      display: block;

      width: 100%;
      height: 86px;

      border: 2px solid #aaaaaa;
      border-radius: 22px;

      background: #ffffff;

      padding: 0 28px;

      font-size: 22px;
      font-weight: 500;

      color: #111111;

      outline: none;

      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    input::placeholder {
      color: #aaaaaa;
    }

    input:focus {
      border-color: #168ff7;

      box-shadow:
        0 0 0 4px rgba(22, 143, 247, 0.10);
    }

    /* Remove number arrows */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    /* NOTICE */
    .notice {
      max-width: 470px;

      margin: 44px auto 0;

      text-align: center;

      color: #777777;

      font-size: 15px;
      font-weight: 500;
      line-height: 1.55;
    }

    /* BUTTON */
    .continue-btn {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 76px;

      margin-top: 95px;

      border: 0;
      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          #269cf7,
          #1689ef
        );

      color: #ffffff;

      font-size: 23px;
      font-weight: 850;

      cursor: pointer;

      box-shadow:
        0 10px 25px rgba(22, 143, 247, 0.15);

      transition:
        transform 0.15s,
        opacity 0.15s;
    }

    .continue-btn:active {
      transform: scale(0.985);
    }

    .continue-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    /* SPINNER */
    .spinner {
      display: none;

      width: 24px;
      height: 24px;

      border: 3px solid rgba(255,255,255,.4);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MESSAGE */
    #msg {
      min-height: 22px;

      margin-top: 17px;

      text-align: center;

      font-size: 14px;
      font-weight: 600;

      color: #d93025;
    }

    /* PAYMENT REFERENCE */
    .reference {
      display: none;

      margin-top: 17px;

      text-align: center;

      font-size: 13px;
      color: #777;
    }

    /* MOBILE */
    @media (max-width: 480px) {

      .top {
        height: 200px;
      }

      .page {
        margin-top: 170px;

        min-height: calc(100vh - 170px);

        border-radius: 40px 40px 0 0;

        padding-top: 67px;
        padding-left: 25px;
        padding-right: 25px;
      }

      .logo {
        font-size: 44px;
      }

      .logo span {
        font-size: 29px;
      }

      .subtitle {
        font-size: 20px;
        margin-top: 46px;
        margin-bottom: 55px;
      }

      input {
        height: 82px;
        font-size: 21px;
      }

      .continue-btn {
        margin-top: 85px;
        height: 73px;
      }
    }

  </style>
</head>

<body>

  <div class="top"></div>

  <main class="page">

    <div class="container">

      <div class="logo">
        PAYMENT
        <span>WALLET</span>
      </div>

      <div class="subtitle">
        Payments, made simple
      </div>

      <form id="paymentForm" novalidate>

        <!-- WALLET -->
        <div class="field">

          <label for="wallet">
            Wallet ID
          </label>

          <input
            id="wallet"
            name="wallet"
            type="tel"
            inputmode="numeric"
            autocomplete="off"
            placeholder="07XXXXXXXX"
            maxlength="20"
            required
          >

        </div>


        <!-- AMOUNT -->
        <div class="field">

          <label for="amount">
            Amount
          </label>

          <input
            id="amount"
            name="amount"
            type="number"
            inputmode="decimal"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          >

        </div>


        <div class="notice">
          By continuing, you confirm the Wallet ID and
          payment amount shown above.
        </div>


        <button
          class="continue-btn"
          id="btn"
          type="submit"
        >

          <span id="buttonText">
            Continue
          </span>

          <span
            class="spinner"
            id="spinner"
          ></span>

        </button>


        <div id="msg"></div>

        <div
          class="reference"
          id="reference"
        ></div>

      </form>

    </div>

  </main>


<script>

  const form =
    document.getElementById("paymentForm");

  const walletInput =
    document.getElementById("wallet");

  const amountInput =
    document.getElementById("amount");

  const btn =
    document.getElementById("btn");

  const buttonText =
    document.getElementById("buttonText");

  const spinner =
    document.getElementById("spinner");

  const msg =
    document.getElementById("msg");


  /* WALLET INPUT:
     keep digits only
  */

  walletInput.addEventListener("input", () => {

    walletInput.value =
      walletInput.value.replace(/\D/g, "");

    msg.textContent = "";

  });


  amountInput.addEventListener("input", () => {

    msg.textContent = "";

  });


  /* GENERATE PAYMENT REFERENCE */

  function generateReference() {

    const time =
      Date.now()
        .toString()
        .slice(-8);

    const random =
      Math.floor(
        1000 + Math.random() * 9000
      );

    return `PAY-${time}-${random}`;

  }


  /* SUBMIT */

  form.addEventListener(
    "submit",
    (event) => {

      event.preventDefault();

      const wallet =
        walletInput.value.trim();

      const amount =
        amountInput.value.trim();


      /* VALIDATION */

      if (!wallet) {

        msg.textContent =
          "Please enter your Wallet ID.";

        walletInput.focus();

        return;
      }


      if (wallet.length < 6) {

        msg.textContent =
          "Please enter a valid Wallet ID.";

        walletInput.focus();

        return;
      }


      if (
        !amount ||
        Number(amount) <= 0
      ) {

        msg.textContent =
          "Please enter a valid amount.";

        amountInput.focus();

        return;
      }


      /* PROCESSING */

      btn.disabled = true;

      buttonText.style.display =
        "none";

      spinner.style.display =
        "block";

      msg.textContent = "";


      const reference =
        generateReference();


      /*
       Save only for this browser tab/session.
       No PIN, password or OTP is collected.
      */

      sessionStorage.setItem(
        "payment_reference",
        reference
      );

      sessionStorage.setItem(
        "wallet_id",
        wallet
      );

      sessionStorage.setItem(
        "payment_amount",
        amount
      );


      /* GO TO NEXT PAGE */

      setTimeout(() => {

        window.location.href =
          "./verify.html?ref=" +
          encodeURIComponent(reference);

      }, 700);

    }
  );

</script>

</body>
</html>
