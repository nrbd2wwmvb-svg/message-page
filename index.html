<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Wallet</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:#fff;
      min-height:100vh;
      color:#111
    }
    .top{
      height:205px;
      background:linear-gradient(135deg,#159cff,#1688ee)
    }
    .card{
      margin-top:-25px;
      min-height:calc(100vh - 180px);
      background:white;
      border-radius:42px 42px 0 0;
      padding:75px 28px 40px
    }
    .logo{
      text-align:center;
      font-weight:900;
      font-size:44px;
      line-height:.9;
      margin-bottom:45px
    }
    .logo span{
      display:block;
      font-size:30px;
      margin-top:12px
    }
    .subtitle{
      text-align:center;
      font-size:20px;
      font-weight:600;
      margin-bottom:50px
    }
    form{
      max-width:520px;
      margin:auto
    }
    .field{
      position:relative;
      margin-bottom:28px
    }
    .field label{
      position:absolute;
      left:30px;
      top:-13px;
      background:#fff;
      padding:0 10px;
      font-size:18px;
      color:#999;
      font-weight:600
    }
    input{
      width:100%;
      height:82px;
      border:2px solid #aaa;
      border-radius:20px;
      padding:0 28px;
      font-size:21px;
      outline:none
    }
    input:focus{
      border-color:#168ff7
    }
    .notice{
      margin:35px auto 0;
      text-align:center;
      color:#777;
      line-height:1.5;
      font-size:14px;
      max-width:460px
    }
    button{
      width:100%;
      height:72px;
      margin-top:90px;
      border:0;
      border-radius:22px;
      background:#168ff7;
      color:#fff;
      font-size:22px;
      font-weight:800
    }
    button:disabled{
      opacity:.6
    }
    #msg{
      text-align:center;
      margin-top:18px;
      font-size:14px
    }
  </style>
</head>

<body>

<div class="top"></div>

<div class="card">

  <div class="logo">
    PAYMENT
    <span>WALLET</span>
  </div>

  <div class="subtitle">
    Payments, made simple
  </div>

  <form id="paymentForm">

    <div class="field">
      <label>Wallet ID</label>
      <input
        id="wallet"
        type="text"
        placeholder="07XXXXXXXX"
        maxlength="20"
        required
      >
    </div>

    <div class="field">
      <label>Amount</label>
      <input
        id="amount"
        type="number"
        placeholder="0.00"
        min="0.01"
        step="0.01"
        required
      >
    </div>

    <div class="notice">
      By continuing, the Wallet ID and payment amount you enter
      will be sent to the owner of this payment page.
    </div>

    <button id="btn" type="submit">
      Continue
    </button>

    <div id="msg"></div>

  </form>

</div>

<script>

const BACKEND_URL = "PUT_YOUR_WORKER_URL_HERE";

const form = document.getElementById("paymentForm");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const wallet = document.getElementById("wallet").value.trim();
  const amount = document.getElementById("amount").value.trim();

  if(!wallet || !amount){
    msg.textContent = "Please complete both fields.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Processing...";
  msg.textContent = "";

  try{

    const response = await fetch(BACKEND_URL + "/payment",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        wallet,
        amount
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    sessionStorage.setItem("payment_reference",data.reference);

    window.location.href =
      "verify.html?ref=" +
      encodeURIComponent(data.reference);

  }catch(error){

    msg.textContent = "Unable to submit. Please try again.";

    btn.disabled = false;
    btn.textContent = "Continue";

  }

});

</script>

</body>
</html>
