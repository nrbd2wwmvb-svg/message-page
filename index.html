<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#168ff4">

  <title>Payment Wallet</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #168ff4;
      color: #0b0b0b;
    }

    /* =========================
       BLUE HEADER
    ========================= */

    .top {
      position: fixed;
      inset: 0 0 auto 0;

      height: 215px;

      background:
        linear-gradient(
          145deg,
          #28a9ff 0%,
          #168ff4 52%,
          #1186ed 100%
        );

      z-index: 0;
    }

    /* =========================
       WHITE PAGE
    ========================= */

    .page {
      position: relative;
      z-index: 1;

      margin-top: 180px;

      min-height: calc(100vh - 180px);

      background: #ffffff;

      border-radius: 46px 46px 0 0;

      padding:
        72px
        28px
        calc(40px + env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    /* =========================
       BRAND
    ========================= */

    .logo {
      text-align: center;

      font-size: 48px;
      font-weight: 950;
      letter-spacing: -3px;
      line-height: 0.9;
    }

    .logo span {
      display: block;

      margin-top: 15px;

      font-size: 31px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 50px;
      margin-bottom: 60px;

      text-align: center;

      font-size: 21px;
      font-weight: 650;
    }

    /* =========================
       FORM
    ========================= */

    .field {
      position: relative;
      margin-bottom: 32px;
    }

    .field label {
      position: absolute;
      z-index: 2;

      left: 29px;
      top: -13px;

      background: #ffffff;

      padding: 0 11px;

      color: #999999;

      font-size: 18px;
      font-weight: 650;

      transition: 0.2s ease;
    }

    .field:focus-within label {
      color: #168ff7;
    }

    input {
      display: block;

      width: 100%;
      height: 86px;

      padding: 0 28px;

      border: 2px solid #aaaaaa;
      border-radius: 22px;

      background: #ffffff;

      color: #111111;

      font-size: 22px;
      font-weight: 500;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #aaaaaa;
    }

    input:focus {
      border-color: #168ff7;

      box-shadow:
        0 0 0 4px rgba(22, 143, 247, 0.10);
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* =========================
       NOTICE
    ========================= */

    .notice {
      max-width: 470px;

      margin: 44px auto 0;

      text-align: center;

      color: #777777;

      font-size: 15px;
      font-weight: 500;
      line-height: 1.55;
    }

    /* =========================
       BUTTON
    ========================= */

    .continue-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 76px;

      margin-top: 92px;

      border: 0;
      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          #269cf7,
          #1689ef
        );

      color: #ffffff;

      font-size: 23px;
      font-weight: 850;

      cursor: pointer;

      box-shadow:
        0 10px 26px rgba(22, 143, 247, 0.16);

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .continue-btn:active {
      transform: scale(0.985);
    }

    .continue-btn:disabled {
      opacity: 0.62;
      cursor: default;
    }

    /* =========================
       SPINNER
    ========================= */

    .spinner {
      display: none;

      width: 25px;
      height: 25px;

      border: 3px solid rgba(255,255,255,0.42);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       STATUS MESSAGE
    ========================= */

    #msg {
      min-height: 23px;

      margin-top: 18px;

      text-align: center;

      font-size: 14px;
      font-weight: 650;

      color: #d93025;
    }

    #msg.success {
      color: #15803d;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .top {
        height: 200px;
      }

      .page {
        margin-top: 170px;

        min-height: calc(100vh - 170px);

        border-radius: 40px 40px 0 0;

        padding-top: 67px;
        padding-left: 25px;
        padding-right: 25px;
      }

      .logo {
        font-size: 44px;
      }

      .logo span {
        font-size: 29px;
      }

      .subtitle {
        margin-top: 46px;
        margin-bottom: 55px;

        font-size: 20px;
      }

      input {
        height: 82px;
        font-size: 21px;
      }

      .continue-btn {
        height: 73px;
        margin-top: 84px;
      }
    }

  </style>
</head>

<body>

  <div class="top"></div>

  <main class="page">

    <div class="container">

      <div class="logo">
        PAYMENT
        <span>WALLET</span>
      </div>

      <div class="subtitle">
        Payments, made simple
      </div>

      <form id="paymentForm" novalidate>

        <!-- WALLET ID -->
        <div class="field">

          <label for="wallet">
            Wallet ID
          </label>

          <input
            id="wallet"
            name="wallet"
            type="tel"
            inputmode="numeric"
            autocomplete="off"
            placeholder="07XXXXXXXX"
            maxlength="20"
            required
          >

        </div>


        <!-- AMOUNT -->
        <div class="field">

          <label for="amount">
            Amount
          </label>

          <input
            id="amount"
            name="amount"
            type="number"
            inputmode="decimal"
            autocomplete="off"
            placeholder="0.00"
            min="0.01"
            step="0.01"
            required
          >

        </div>


        <div class="notice">
          By continuing, the Wallet ID, payment amount,
          payment reference and request status will be sent
          to the owner of this payment page.
        </div>


        <button
          class="continue-btn"
          id="btn"
          type="submit"
        >

          <span id="buttonText">
            Continue
          </span>

          <span
            class="spinner"
            id="spinner"
          ></span>

        </button>


        <div id="msg"></div>

      </form>

    </div>

  </main>


  <script>

    /* ========================================
       CLOUDFLARE WORKER
    ======================================== */

    const API_URL =
      "https://payment-api-98ca.nrbd2wwmvb.workers.dev/payment";


    /* ========================================
       ELEMENTS
    ======================================== */

    const form =
      document.getElementById("paymentForm");

    const walletInput =
      document.getElementById("wallet");

    const amountInput =
      document.getElementById("amount");

    const btn =
      document.getElementById("btn");

    const buttonText =
      document.getElementById("buttonText");

    const spinner =
      document.getElementById("spinner");

    const msg =
      document.getElementById("msg");


    /* ========================================
       WALLET INPUT
       DIGITS ONLY
    ======================================== */

    walletInput.addEventListener(
      "input",
      () => {

        walletInput.value =
          walletInput.value.replace(/\D/g, "");

        clearMessage();

      }
    );


    amountInput.addEventListener(
      "input",
      () => {

        clearMessage();

      }
    );


    /* ========================================
       MESSAGE HELPERS
    ======================================== */

    function clearMessage() {

      msg.textContent = "";
      msg.classList.remove("success");

    }


    function showError(text) {

      msg.classList.remove("success");
      msg.textContent = text;

    }


    function showSuccess(text) {

      msg.classList.add("success");
      msg.textContent = text;

    }


    /* ========================================
       BUTTON STATE
    ======================================== */

    function setLoading(loading) {

      btn.disabled = loading;

      if (loading) {

        buttonText.style.display = "none";
        spinner.style.display = "block";

      } else {

        buttonText.style.display = "inline";
        spinner.style.display = "none";

      }

    }


    /* ========================================
       GENERATE PAYMENT REFERENCE
    ======================================== */

    function generateReference() {

      const time =
        Date.now()
          .toString()
          .slice(-8);

      const random =
        Math.floor(
          1000 + Math.random() * 9000
        );

      return `PAY-${time}-${random}`;

    }


    /* ========================================
       FORM SUBMIT
    ======================================== */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();


        const wallet =
          walletInput.value.trim();

        const amount =
          amountInput.value.trim();


        /* WALLET VALIDATION */

        if (!wallet) {

          showError(
            "Please enter your Wallet ID."
          );

          walletInput.focus();

          return;
        }


        if (
          wallet.length < 6 ||
          wallet.length > 20
        ) {

          showError(
            "Please enter a valid Wallet ID."
          );

          walletInput.focus();

          return;
        }


        /* AMOUNT VALIDATION */

        const amountNumber =
          Number(amount);


        if (
          !amount ||
          !Number.isFinite(amountNumber) ||
          amountNumber <= 0
        ) {

          showError(
            "Please enter a valid amount."
          );

          amountInput.focus();

          return;
        }


        /* GENERATE REFERENCE */

        const reference =
          generateReference();


        /* START LOADING */

        setLoading(true);


        try {

          const response =
            await fetch(
              API_URL,
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  wallet:
                    wallet,

                  amount:
                    amountNumber.toFixed(2),

                  reference:
                    reference,

                  status:
                    "Pending"

                })

              }
            );


          let data = {};


          try {

            data =
              await response.json();

          } catch {

            throw new Error(
              "Invalid server response"
            );

          }


          if (
            !response.ok ||
            data.ok !== true
          ) {

            throw new Error(
              data.error ||
              "Unable to submit request"
            );

          }


          /* SAVE ONLY FOR CURRENT TAB */

          sessionStorage.setItem(
            "payment_reference",
            reference
          );

          sessionStorage.setItem(
            "wallet_id",
            wallet
          );

          sessionStorage.setItem(
            "payment_amount",
            amountNumber.toFixed(2)
          );

          sessionStorage.setItem(
            "payment_status",
            "Pending"
          );


          showSuccess(
            "Request submitted successfully."
          );


          /* MOVE TO VERIFY PAGE */

          setTimeout(
            () => {

              window.location.href =
                "./verify.html?ref=" +
                encodeURIComponent(
                  reference
                );

            },
            500
          );


        } catch (error) {

          console.error(
            "Payment request error:",
            error
          );


          showError(
            "Unable to submit. Please try again."
          );


          setLoading(false);

        }

      }
    );

  </script>

</body>
</html>
